spring.application.name=advanced-ai-hostel-management
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:hostel_management;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
ai.provider.enabled=${AI_PROVIDER_ENABLED:false}
ai.provider.url=${AI_PROVIDER_URL:}
