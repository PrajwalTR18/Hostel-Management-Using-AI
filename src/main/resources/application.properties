spring.application.name=advanced-ai-hostel-management
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostel_management?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
ai.provider.enabled=${AI_PROVIDER_ENABLED:false}
ai.provider.url=${AI_PROVIDER_URL:}
